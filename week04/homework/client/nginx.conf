# 定义Nginx服务
server {
    listen 80;          # Nginx容器监听80端口
    server_name localhost;

    # 处理前端静态资源（匹配所有请求，优先返回dist目录的文件）
    location / {
        root /usr/share/nginx/html;  # 前端静态资源目录（对应Dockerfile中复制的dist）
        index index.html index.htm;
        try_files $uri $uri/ /index.html;  # 解决Vue/React路由刷新404问题
    }

    # 代理后端API请求（前端请求/api/*时，转发到Go后端容器）
    location /api/ {
        proxy_pass http://go-backend:8080/;  # go-backend是后端容器名，8080是后端服务端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}